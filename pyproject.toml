[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashrae-thermal-comfort-ml"
version = "0.1.0"
description = "Phase-1 ML pipeline for ASHRAE thermal comfort classification."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "jupyterlab",
  "ipykernel",
  "statsmodels",
  "xgboost",
  "lightgbm",
  "shap",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
